<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Catálogo NTX</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#16161A"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icono-192.png"><link rel="apple-touch-icon" href="icono-180.png"><meta name="apple-mobile-web-app-title" content="NTX"><style>body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Catálogos NTX (motores, aspas...) como herramienta de pedido: selector de línea arriba, banda oscura fija arriba (buscar y filtrar),
   fichas del catálogo con precio, stock y cantidad, y barra roja abajo que lleva al pedido. Todo lo rojo se toca. */
@font-face{font-family:"BSD";src:url("fonts/BSD.ttf") format("truetype");font-weight:100 900;font-display:swap}
:root{
  --bg:#EEF0F2;--surface:#FFFFFF;--ink:#16161A;--mut:#55575C;--line:#D5D7DB;--chip:#EEF0F2;
  --red:#D7141E;--red-soft:#FFE1E2;--on-red:#FFFFFF;--band:#16161A;--band-ink:#FFFFFF;--band-mut:#C9CBD0;--band-field:#2B2C30;
  --ok:#17693A;--ok-bg:#DFF3E6;--warn:#8A4B00;--warn-bg:#FCEBCF;--off:#55575C;--off-bg:#E2E4E8;--photo:#FFFFFF;--icofill:#D9DBDF;
  --display:"BSD","Arial Narrow","Roboto Condensed",Impact,sans-serif;--text:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0E10;--surface:#1B1C20;--ink:#F2F3F5;--mut:#A9ACB3;--line:#34363C;--chip:#2B2C30;
  --red:#E3222C;--red-soft:#4A1114;--on-red:#FFFFFF;--band:#000000;--band-ink:#FFFFFF;--band-mut:#C9CBD0;--band-field:#26272B;
  --ok:#6FD79A;--ok-bg:#12331F;--warn:#F2B25C;--warn-bg:#3A2706;--off:#A9ACB3;--off-bg:#2B2C30;--photo:#FFFFFF;--icofill:#55575C;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E10;--surface:#1B1C20;--ink:#F2F3F5;--mut:#A9ACB3;--line:#34363C;--chip:#2B2C30;
  --red:#E3222C;--red-soft:#4A1114;--on-red:#FFFFFF;--band:#000000;--band-ink:#FFFFFF;--band-mut:#C9CBD0;--band-field:#26272B;
  --ok:#6FD79A;--ok-bg:#12331F;--warn:#F2B25C;--warn-bg:#3A2706;--off:#A9ACB3;--off-bg:#2B2C30;--photo:#FFFFFF;--icofill:#55575C;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.bs{font-family:var(--display);font-weight:700;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}

/* banda superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--band);color:var(--band-ink)}
.top .wrap{padding-block:10px 8px;display:grid;gap:8px}
.t1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.t1 img{height:20px;width:auto;flex:none}
.lin{display:flex;flex:none}
.t1 h1{order:0}
.lin button{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.02em;line-height:1;padding:9px 9px;border:1.5px solid #55575C;color:var(--band-mut);margin-left:-1.5px}
.lin button:first-child{border-radius:8px 0 0 8px;margin-left:0}.lin button:last-child{border-radius:0 8px 8px 0}
.lin button[aria-pressed="true"]{background:var(--band-ink);border-color:var(--band-ink);color:var(--band);position:relative}
.t1 h1{margin:0;font-size:24px;line-height:1;flex:1;min-width:0}
.lnk{font-weight:700;font-size:13px;color:var(--band-ink);border:1.5px solid #55575C;border-radius:8px;padding:8px 9px;white-space:nowrap;margin-left:auto}
.back{margin-left:auto;background:var(--red);color:var(--on-red);font-weight:800;letter-spacing:.06em;font-size:13px;border-radius:8px;padding:9px 13px;white-space:nowrap}
.back:not([hidden])+.lnk{margin-left:0}
.srch{display:flex;gap:8px}
.srch input{flex:1;min-width:0;background:var(--band-field);border:1.5px solid transparent;border-radius:10px;padding:11px 12px;font-size:16px;color:var(--band-ink)}
.srch input::placeholder{color:var(--band-mut)}
.srch input:focus{border-color:var(--red);outline:none}
.scroller{overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)))}
.scroller::-webkit-scrollbar{display:none}
.chips{display:flex;gap:6px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));width:max-content}
.chips button{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.02em;padding:6px 11px;border-radius:8px;border:1.5px solid #55575C;color:var(--band-ink);white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on-red)}

/* barra de opciones bajo la banda */
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:12px 4px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{padding:8px 13px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.lbl{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--mut);text-transform:uppercase}
.tog{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.tog input{width:18px;height:18px;accent-color:var(--red)}
.cnt{margin-left:auto;font-size:13px;color:var(--mut);font-weight:600}
.msg{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:10px}

/* fichas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:10px;padding-block:8px 110px}
.fam{grid-column:1/-1;margin:10px 0 0;font-size:26px;line-height:1;color:var(--red);border-bottom:2px solid var(--ink);padding-bottom:5px}
.cd{background:var(--surface);border-radius:12px;padding:10px;display:grid;grid-template-columns:118px minmax(0,1fr);gap:4px 12px;border:1.5px solid transparent}
.cd.in{border-color:var(--red)}
.ph{position:relative;background:var(--photo);border-radius:8px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;width:100%;grid-row:1/3;align-self:start}
.ph img.v1{width:92%;height:92%;object-fit:contain}
.ph img.v2{position:absolute;right:3px;bottom:3px;width:36%;height:36%;object-fit:contain;background:#fff;border:1px solid #D5D7DB;border-radius:5px}
.ph .nof{font-size:10px;font-weight:800;letter-spacing:.1em;color:#55575C;text-align:center}
.cod{font-size:34px;line-height:.9}
.cr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dia{font-size:19px;line-height:1;border:2px solid var(--ink);border-radius:6px;padding:3px 7px;white-space:nowrap}
button.tg.asp{font-family:var(--text);min-height:22px}
.oth{grid-column:1/-1;text-align:left;background:var(--surface);border:1.5px solid var(--red);color:var(--red);font-weight:800;border-radius:10px;padding:11px 12px}
.b1{font-size:19px;line-height:1;color:var(--red);margin-top:3px}
.b2{font-size:10.5px;font-weight:800;color:var(--red);letter-spacing:.03em;margin-top:2px}
.chp{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.ej,.tg{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 6px;white-space:nowrap}
.ej{border:1.3px solid var(--ink)}
.ej svg{width:13px;height:13px;flex:none}
.tg{background:var(--ink);color:var(--surface)}
.tg.asp{background:var(--red);color:var(--on-red)}
.app{font-weight:700;font-size:13.5px;line-height:1.25;margin-top:6px;overflow-wrap:anywhere}
.buy{grid-column:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.pr{font-size:26px;line-height:1}
.st{font-size:11px;font-weight:800;border-radius:20px;padding:3px 8px;white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.low{background:var(--warn-bg);color:var(--warn)}.st.no{background:var(--off-bg);color:var(--off)}
.add{margin-left:auto;background:var(--red);color:var(--on-red);font-weight:800;letter-spacing:.05em;font-size:13px;border-radius:9px;padding:10px 14px;min-height:40px}
.stp{margin-left:auto;display:inline-flex;align-items:center;border-radius:9px;overflow:hidden;background:var(--red);color:var(--on-red)}
.stp button{width:40px;height:40px;font-size:22px;font-weight:700;color:var(--on-red);line-height:1}
.stp input{width:44px;height:40px;text-align:center;border:0;background:var(--surface);color:var(--ink);font-weight:800;font-size:16px;border-block:2px solid var(--red);-moz-appearance:textfield;border-radius:0}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.empty{grid-column:1/-1;background:var(--surface);border-radius:12px;padding:26px 18px;text-align:center;color:var(--mut);font-weight:600}

/* barra roja inferior */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--red);color:var(--on-red);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar button{display:flex;align-items:center;gap:12px;width:100%;max-width:1180px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--on-red);text-align:left}
.bar b{display:block;font-weight:800;letter-spacing:.05em;font-size:16px}
.bar span{font-size:12.5px;font-weight:600;color:#FFE1E2}
.bar i{margin-left:auto;font-style:normal;font-size:30px;font-weight:800;line-height:1}
.bar .tot{font-size:30px;line-height:1}

/* pedido */
.pg{max-width:720px;margin:0 auto;display:grid;gap:14px;padding-block:14px 40px}
.pg h2{margin:0;font-size:32px;line-height:1}
.box{background:var(--surface);border-radius:12px;padding:14px;display:grid;gap:10px}
.box>.lbl{margin-bottom:-2px}
.fld{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px;font-size:16px}
.fld:focus{border-color:var(--red);outline:none}
textarea.fld{min-height:70px;resize:vertical}
.sug{display:grid;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.sug button{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-weight:600;display:flex;gap:8px;align-items:baseline}
.sug button:last-child{border-bottom:0}
.sug em{font-style:normal;font-size:11px;color:var(--mut);font-weight:700;margin-left:auto;white-space:nowrap}
.sel{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:11px 12px;font-weight:800}
.sel span{flex:1;min-width:0;overflow-wrap:anywhere}
.sel small{display:block;font-weight:600;color:var(--mut);font-size:12px}
.txt{color:var(--red);font-weight:800;font-size:13px;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.two{display:flex;flex-wrap:wrap;gap:12px 22px}
.two>div{display:grid;gap:6px}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.ln:last-of-type{border-bottom:0}
.ln .c{font-size:24px;line-height:1}
.ln .d{font-size:12.5px;color:var(--mut);font-weight:600;overflow-wrap:anywhere}
.ln .w{font-size:12px;font-weight:700;color:var(--warn)}
.ln .m{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut);font-weight:600}
.ln .m b{margin-left:auto;color:var(--ink);font-size:16px}
.ln .stp{margin-left:0}
.dsc{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pct{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.pct input{width:76px;padding:8px 10px}
.pct small{color:var(--mut);font-weight:600}
.vd{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:8px;border-bottom:1px solid var(--line)}
.vd:last-child{border-bottom:0}
.vd span{flex:1;min-width:150px}
.vd small{display:block;color:var(--mut);font-weight:600;font-size:12px}
.vd select{width:auto;min-width:130px;padding:9px 10px}
.sum{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-top:2px solid var(--ink);padding-top:10px}
.sum b{font-size:38px;line-height:1}
.send{background:var(--red);color:var(--on-red);font-weight:800;letter-spacing:.06em;font-size:17px;border-radius:12px;padding:16px;width:100%;display:block;text-align:center;text-decoration:none}
a.ghost{display:block;text-align:center;text-decoration:none;color:var(--ink)}
.cod2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.cod2 input{flex:1;min-width:160px;background:var(--surface);text-transform:uppercase}
.cod2 button{background:var(--red);color:var(--on-red);font-weight:800;letter-spacing:.05em;border-radius:10px;padding:0 16px;min-height:46px}
.inf{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;font-weight:600;font-size:13.5px}
.send[disabled]{background:var(--off-bg);color:var(--off);cursor:not-allowed}
.ghost{border:1.5px solid var(--line);border-radius:12px;padding:13px;font-weight:800;width:100%;background:var(--surface)}
.hint{font-size:13px;color:var(--mut);font-weight:500;margin:0}
.okb{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:14px;font-weight:700}
.okb b{display:block;font-size:17px}
pre.copy{margin:0;background:var(--bg);border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}

/* enviados */
.od{background:var(--surface);border-radius:12px;padding:14px;display:grid;gap:6px}
.od .h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.od .h b{font-size:16px;flex:1;min-width:0;overflow-wrap:anywhere}
.od .i{font-size:13px;color:var(--mut);font-weight:600;overflow-wrap:anywhere}
.od .f{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.od .f .pr{font-size:24px}

/* foto ampliada */
.zoom{position:fixed;inset:0;z-index:20;background:rgba(10,10,12,.92);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.zoom div{display:grid;gap:10px;max-width:560px;width:100%;max-height:100%;overflow:auto}
.zoom img{width:100%;background:#fff;border-radius:10px;object-fit:contain;max-height:42vh}
.zoom button{background:var(--red);color:#fff;font-weight:800;letter-spacing:.06em;border-radius:10px;padding:13px}
@media (max-width:380px){.cd{grid-template-columns:96px minmax(0,1fr)}.cod{font-size:30px}}
@media (prefers-reduced-motion:no-preference){.cd{transition:border-color .15s}}
</style>

<header class="top"><div class="wrap">
  <div class="t1">
    <img src="img/logo.png" alt="NTX Original Parts">
    <div class="lin" id="lin" role="group" aria-label="Línea de productos"></div>
    <h1 class="bs" id="ttl" hidden>PEDIDO</h1>
    <button class="back" id="btnBack" hidden>‹ CATÁLOGO</button>
    <button class="lnk" id="btnEnv">Enviados</button>
  </div>
  <div id="tools" style="display:grid;gap:8px">
    <div class="srch"><input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Busca código, marca o modelo" aria-label="Buscar pieza"></div>
    <div class="scroller"><div class="chips" id="brands"></div></div>
  </div>
</div></header>

<main class="wrap">
  <section id="vCat">
    <div class="opts">
      <span class="lbl">Tarifa</span>
      <div class="seg" id="segT" role="group" aria-label="Tarifa"></div>
      <label class="tog"><input type="checkbox" id="onlyStock"> Solo con stock</label>
      <span class="cnt" id="cnt"></span>
    </div>
    <div class="msg" id="dataMsg" hidden></div>
    <div class="inf" id="codeBox" hidden><span id="codeTxt">Vendedores: ingresa tu código para ver precios, stock y tus clientes.</span><div class="cod2"><input class="fld" id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Tu código de vendedor" aria-label="Código de vendedor"><button id="codeGo">ENTRAR</button></div></div>
    <div class="msg" id="accMsg" hidden>Tu acceso como vendedor aún no está activado: puedes ver el catálogo, pero no enviar pedidos. Avísale a Mango para que te asigne tu cartera.</div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="vPed" class="pg" hidden></section>
  <section id="vEnv" class="pg" hidden></section>
</main>

<div class="bar" id="bar" hidden><button id="btnCart"><span><b>VER PEDIDO</b><span id="barTxt"></span></span><span class="tot bs num" id="barTot"></span><i>›</i></button></div>
<div class="zoom" id="zoom" hidden><div><img id="z1" alt=""><img id="z2" alt=""><button id="zClose">CERRAR</button></div></div>

const price = (c, t) => { const p = S.precios && S.precios[c]; const v = p ? p[TIDX[t || S.tarifa]] : null; return typeof v === "number" && v > 0 ? v : null; };

/* iconos de eje y fijación (los del catálogo) */
function ico(k){
  const st = 'fill="none" stroke="currentColor" stroke-width="2.6"', f = 'var(--icofill)';
  const b = {
    doble:`<path d="M11 8.2 A15 15 0 0 1 29 8.2 V31.8 A15 15 0 0 1 11 31.8 Z" fill="${f}" ${st}/>`,
    media:`<path d="M26 6.1 A15 15 0 1 0 26 33.9 Z" fill="${f}" ${st}/>`,
    rosca:`<rect x="3" y="15" width="8" height="10" fill="${f}" ${st}/><rect x="9" y="13" width="26" height="14" rx="1" fill="${f}" ${st}/><path d="M14 13l2 14M20 13l2 14M26 13l2 14" stroke="currentColor" stroke-width="1.8"/>`,
    pasador:`<circle cx="20" cy="20" r="13" fill="${f}" ${st}/><rect x="1.5" y="17" width="37" height="6" rx="2" fill="var(--red)"/>`,
    clip:`<rect x="3" y="14" width="30" height="12" rx="2" fill="${f}" ${st}/><path d="M27 8 C34 8 34 32 27 32" fill="none" stroke="var(--red)" stroke-width="3"/>`,
    acople:`<path d="M20 4 L24 16 L36 20 L24 24 L20 36 L16 24 L4 20 L16 16 Z" fill="${f}" ${st}/>`
  }[k];
  return b ? `<svg viewBox="0 0 40 40" aria-hidden="true">${b}</svg>` : "";
}
function ejeChips(i){
  let o = "";
  const kf = {Rosca:"rosca",Pasador:"pasador",Clip:"clip","Acople estrella":"acople"}[i.fj] || "";
  if(i.fj) o += `<span class="ej">${ico(kf)}Fijación ${esc(i.fj)}</span>`;
  if(i.fj !== "Acople estrella"){
    if(i.fo && i.fo !== "No aplica"){ const ks = i.fo.startsWith("Doble") ? "doble" : i.fo.startsWith("Media") ? "media" : /pasador/i.test(i.fo) ? "pasador" : ""; o += `<span class="ej">${ico(ks)}${i.fo.startsWith("Eje ") ? "" : "Eje "}${esc(i.fo)}</span>`; }
    if(i.lg) o += `<span class="ej">Eje largo</span>`;
  }
  return o;
}

/* catálogo */
function stockPill(c){
  const s = stock(c); if(s == null) return "";
  if(s <= 0) return `<span class="st no">Sin stock</span>`;
  return `<span class="st ${s <= 2 ? "low" : "ok"} num">${s} disp.</span>`;
}
function buyHtml(c){
  const q = S.cart[c] || 0, p = price(c);
  const pr = p != null ? `<span class="pr bs num">${money(p)}</span>` : (S.precios ? `<span class="st no">Sin precio</span>` : "");
  const ctl = q > 0
    ? `<span class="stp"><button data-act="dec" data-c="${esc(c)}" aria-label="Quitar uno de ${esc(c)}">−</button><input class="num" id="q-${esc(c)}" type="number" inputmode="numeric" min="0" max="999" value="${q}" data-c="${esc(c)}" aria-label="Cantidad de ${esc(c)}"><button data-act="inc" data-c="${esc(c)}" aria-label="Agregar uno de ${esc(c)}">+</button></span>`
    : `<button class="add" data-act="inc" data-c="${esc(c)}">AGREGAR</button>`;
  return pr + stockPill(c) + ctl;
}
function cardHtml(i){
  const ph = i.i1 ? `<img class="v1" loading="lazy" src="img/${esc(i.c)}.jpg" alt="${esc(i.c)}"${i.sc ? ` style="transform:scale(${i.sc})"` : ""}>` + (i.i2 ? `<img class="v2" loading="lazy" src="img/${esc(i.c)}_2.jpg" alt="">` : "") : `<span class="nof">FOTO<br>PRÓXIMAMENTE</span>`;
  const tags = i.t.map(t => `<span class="tg">${esc(t)}</span>`).join("") + (i.s ? `<span class="tg">${esc(i.s)}</span>` : "") + i.x.map(a => BY[a] ? `<button class="tg asp" data-act="goto" data-c="${esc(a)}">${i.l === "aspas" ? "MOTOR" : "ASPA"} ${esc(a)} ›</button>` : `<span class="tg asp">${i.l === "aspas" ? "MOTOR" : "ASPA"} ${esc(a)}</span>`).join("");
  return `<article class="cd${S.cart[i.c] ? " in" : ""}" id="cd-${esc(i.c)}">
    <button class="ph" data-act="zoom" data-c="${esc(i.c)}" aria-label="Ampliar fotos de ${esc(i.c)}">${ph}</button>
    <div><div class="cr"><div class="cod bs">${esc(i.c)}</div>${i.d ? `<span class="dia bs num">Ø ${cm(i.d)} cm</span>` : ""}</div><div class="b1 bs">${esc(i.b[0])}</div>${i.b.length > 1 ? `<div class="b2">+ ${esc(i.b.slice(1).join(" · "))}</div>` : ""}
    <div class="chp">${ejeChips(i)}${tags}</div><div class="app">${esc(i.m)}</div></div>
    <div class="buy" id="buy-${esc(i.c)}">${buyHtml(i.c)}</div></article>`;
}
function filtered(){

}
function enOtras(){
  const words = norm(S.q).split(/\s+/).filter(Boolean); if(!words.length) return "";

  else if(act === "vaciar"){ if(a.dataset.sure){ S.cart = {}; save(); renderGrid(); go("catalogo"); } else { a.dataset.sure = "1"; a.textContent = "Toca otra vez para vaciar el pedido"; } }
  else if(act === "copy"){ const txt = $("cp").textContent; const done = () => { a.textContent = "Copiado"; }; const sel = () => { const r = document.createRange(); r.selectNodeContents($("cp")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); a.textContent = "Texto seleccionado: cópialo"; };
    try{ navigator.clipboard.writeText(txt).then(done, sel); }catch(_){ sel(); } }
  else if(act === "delask"){ S.del = a.dataset.id; renderEnv(); }
  else if(act === "delno"){ S.del = null; renderEnv(); }
  else if(act === "delok"){ const id = a.dataset.id; S.del = null; if(db) db.doc("pedidos/" + id).delete().catch(() => {}); }
});
document.addEventListener("change", e => {
  if(e.target.id === "dp"){ S.desc.pct = Math.max(1, Math.min(15, Math.round(Number(e.target.value) || 0))); save(); renderPed(); return; }
  if(e.target.dataset && e.target.dataset.acc && S.esDueno && db){ const m = Object.assign({}, S.vend), id = e.target.dataset.acc;
    if(e.target.value) m[id] = { tag:e.target.value, nombre:e.target.dataset.n || "" }; else delete m[id];
    db.doc("datos/vendedores").set({ m }).catch(() => { renderEnv(); }); return; }
  const c = e.target.dataset && e.target.dataset.c; if(e.target.matches(".stp input") && c){ setQty(c, e.target.value); if(!$("vPed").hidden) renderPed(); } });
document.addEventListener("input", e => {
  if(e.target.id === "cq"){ S.cq = e.target.value; renderSug(); }
  else if(e.target.id === "cn" && S.cliente){ S.cliente.nombreNuevo = e.target.value; save(); const b = document.querySelector('[data-act="send"]'); if(b) b.disabled = !canSend(); const h = $("sendHint"); if(h) h.textContent = sendHint(); }
  else if(e.target.id === "nota"){ S.nota = e.target.value; save(); }
});
window.addEventListener("hashchange", route);

/* datos vivos: precios, stock, clientes y pedidos */
function dataMsg(){
  const m = $("dataMsg");
  if(S.dbOk === false){ m.hidden = false; m.textContent = "Aquí no se pudieron cargar precios ni stock. Puedes armar el pedido y copiar el resumen para Claude."; }
  else if(S.precios && S.fecha){ const d = new Date(S.fecha); m.hidden = true; $("cnt").title = "Precios y stock de Holded al " + d.toLocaleString("es-VE"); }
  else m.hidden = true;
}
async function boot(){
  let timer = setTimeout(() => { if(S.dbOk == null){ S.dbOk = false; dataMsg(); if(!$("vEnv").hidden) renderEnv(); } }, 10000);
  try{ db = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){ db = null; }
  if(!db){ clearTimeout(timer); S.dbOk = false; dataMsg(); route(); return; }
  let user = null, uid = null, uname = "";
  try{ user = window.claude.use ? await window.claude.use("user") : null; }catch(e){}
  try{ if(user){ S.esDueno = !!(await user.isOwner()); uid = await user.id(); uname = (await user.name().catch(() => "")) || ""; } }catch(e){}
  const setRol = () => {
    if(!user || S.esDueno){ S.rol = "total"; S.yo = { id:uid || "", nombre:uname || "Mango", tag:"" }; }
    else if(uid && S.vend[uid] && S.vend[uid].tag){ S.rol = "vendedor"; S.yo = { id:uid, nombre:uname || S.vend[uid].nombre || S.vend[uid].tag, tag:S.vend[uid].tag }; }
    else { S.rol = "pendiente"; S.yo = { id:uid || "", nombre:uname, tag:"" }; }
    $("accMsg").hidden = S.rol !== "pendiente";
    if(S.cliente && !S.cliente.nuevo && S.rol === "vendedor" && S.clientes.length && !misClientes().some(c => c.id === S.cliente.id)){ S.cliente = null; save(); }
    if(!$("vPed").hidden && !document.activeElement.matches("input,textarea")) renderPed(); if(!$("vEnv").hidden) renderEnv();
  };
  let registrado = false;
  db.doc("datos/vendedores").onSnapshot(s => { const d = s.exists ? s.data() : null; S.vend = (d && d.m) || {}; setRol();
      if(S.rol === "pendiente" && uid && !registrado){ registrado = true; db.doc("accesos/" + uid).set({ nombre:uname, visto:new Date().toISOString() }).catch(() => {}); } },
    () => { setRol(); });
  if(S.esDueno) db.collection("accesos").limit(50).onSnapshot(q => { S.accesos = q.docs.map(x => Object.assign({ id:x.id }, x.data())); if(!$("vEnv").hidden) renderEnv(); }, () => {});
  if(!$("vPed").hidden) renderPed();
  LINEAS.forEach(l => db.doc("datos/" + l.id).onSnapshot(s => { clearTimeout(timer); S.dbOk = true; const d = s.exists ? s.data() : null;
      if(d && d.p){ S.pp[l.id] = d.p; S.fecha = d.fecha; } else delete S.pp[l.id];
      const all = Object.assign({}, ...Object.values(S.pp)); S.precios = Object.keys(all).length ? all : null; dataMsg(); renderGrid(); route(); },
    () => { clearTimeout(timer); if(S.dbOk == null){ S.dbOk = false; dataMsg(); } }));
  db.doc("datos/clientes").onSnapshot(s => { const d = s.exists ? s.data() : null; S.nuevo = d && d.nuevo && d.nuevo.id ? d.nuevo : null; S.clientes = ((d && d.l) || []).map(c => ({ id:c[0], n:c[1], t:c[2] || "", k:norm(c[1] + " " + (c[2] || "") + " " + (c[3] || "")) })); if(!$("vPed").hidden && !S.cliente && !S.cq) renderPed(); }, () => {});
  db.collection("pedidos").orderBy("creado","desc").limit(40).onSnapshot(q => { S.pedidos = q.docs.map(x => Object.assign({ id:x.id }, x.data())); if(!$("vEnv").hidden) renderEnv(); }, () => { S.pedidos = []; if(!$("vEnv").hidden) renderEnv(); });
}
$("onlyStock").checked = S.onlyStock;
/* página de vendedores: sin base de datos; precios, stock y clientes vienen cifrados y se abren con el código */
function codeUI(msg){
  $("codeBox").hidden = S.rol === "vendedor";
  if(msg) $("codeTxt").textContent = msg;
}
async function unlock(code){
  const c = String(code || "").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(!c) return false;
  if(!(window.crypto && crypto.subtle)){ codeUI("Este navegador no puede abrir el catálogo con código. Prueba con Chrome o Safari actualizados."); return false; }
  const b = s => Uint8Array.from(atob(s), x => x.charCodeAt(0));
  for(const v of VEND){
    try{
      const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(c), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:b(v.s), iterations:150000, hash:"SHA-256" }, km, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
      const d = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name:"AES-GCM", iv:b(v.i) }, key, b(v.d))));
      S.precios = d.p; S.fecha = d.fecha; S.nuevo = d.nuevo || null; S.rol = "vendedor"; S.yo = { id:d.v.k, nombre:d.v.nombre, tag:d.v.tag };
      S.clientes = (d.cl || []).map(x => ({ id:x[0], n:x[1], t:x[2] || "", k:norm(x[1] + " " + (x[2] || "") + " " + (x[3] || "")) }));
      if(S.cliente && !S.cliente.nuevo && !S.clientes.some(x => x.id === S.cliente.id)){ S.cliente = null; save(); }
      try{ localStorage.setItem(LSC, c); }catch(_){}
      codeUI(); renderGrid(); route(); return true;
    }catch(e){}
  }
  return false;
}
async function bootVend(){
  S.rol = "sincodigo"; try{ S.pedidos = JSON.parse(localStorage.getItem(LSE) || "[]") || []; }catch(e){ S.pedidos = []; }
  codeUI(); route();
  const go1 = async () => { const b = $("codeGo"); b.disabled = true; b.textContent = "…"; const ok = await unlock($("code").value); b.disabled = false; b.textContent = "ENTRAR"; if(!ok && S.rol !== "vendedor") codeUI("Ese código no abre el catálogo. Revísalo y vuelve a intentar."); };
  $("codeGo").addEventListener("click", go1); $("code").addEventListener("keydown", e => { if(e.key === "Enter") go1(); });
  let saved = ""; try{ saved = localStorage.getItem(LSC) || ""; }catch(e){}
  if(saved) await unlock(saved);
}
renderLin(); renderBrands(); renderSeg(); renderGrid(); route(); if(EXT) bootVend(); else boot();
</script>
